<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRM Concept Graph</title>
<!-- Generated by scripts/build_graph.py from scripts/graph_template.html. Do not edit by hand. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<style>
  :root {
    --bg: #f8fafc; --panel: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0;
    --term: #2563eb; --concept: #16a34a; --formula: #d97706; --missing: #9ca3af; --edge: #94a3b8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1120; --panel: #111827; --text: #e5e7eb; --muted: #94a3b8; --border: #1f2937;
      --term: #60a5fa; --concept: #4ade80; --formula: #fbbf24; --missing: #6b7280; --edge: #475569;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text);
         display: grid; grid-template-columns: 1fr 320px; height: 100vh; }
  #cy { min-height: 0; }
  aside { background: var(--panel); border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .stats { color: var(--muted); margin-bottom: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; margin: 0 10px 6px 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dashed { border: 2px dashed var(--muted); background: transparent; }
  #detail { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
  #detail h2 { font-size: 15px; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  code, pre { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 6px; display: block;
              white-space: pre-wrap; font-size: 12px; }
  ul { padding-left: 18px; }
  input { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px;
          background: var(--bg); color: var(--text); margin-bottom: 12px; }
  @media (max-width: 720px) {
    body { grid-template-columns: 1fr; grid-template-rows: 60vh auto; height: auto; }
    #cy { height: 60vh; }
    aside { border-left: 0; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
<div id="cy"></div>
<aside>
  <h1>FRM Concept Graph</h1>
  <div class="stats" id="stats"></div>
  <input id="search" placeholder="Find a node…" autocomplete="off">
  <div class="legend">
    <span><i class="dot" style="background:var(--term)"></i>Term</span>
    <span><i class="dot" style="background:var(--concept)"></i>Concept</span>
    <span><i class="dot" style="background:var(--formula)"></i>Formula</span>
    <span><i class="dot" style="background:var(--missing)"></i>Not yet defined</span>
    <span><i class="dot dashed"></i>Missing definition</span>
  </div>
  <div id="detail"><span class="meta">Click a node to see its definition and links.</span></div>
</aside>
<script>
const GRAPH = {
 "edges": [
  {
   "source": "commodity-price-risk",
   "target": "market-risk",
   "type": "related"
  },
  {
   "source": "currency-risk",
   "target": "market-risk",
   "type": "related"
  },
  {
   "source": "equity-risk",
   "target": "market-risk",
   "type": "related"
  },
  {
   "source": "expected-shortfall-normal",
   "target": "parametric-var",
   "type": "related"
  },
  {
   "source": "interest-rate-risk",
   "target": "market-risk",
   "type": "related"
  },
  {
   "source": "parametric-var",
   "target": "parametric-var-sqrt-t",
   "type": "variant"
  },
  {
   "source": "parametric-var",
   "target": "value-at-risk",
   "type": "uses-concept"
  }
 ],
 "nodes": [
  {
   "complete": false,
   "definition": null,
   "id": "bank-operational-risk",
   "kind": "term",
   "latex": null,
   "name": "Bank Operational Risk",
   "part": "frm-part-I",
   "reading": "01_building-blocks-risk-management",
   "source": null
  },
  {
   "complete": false,
   "definition": null,
   "id": "commodity-price-risk",
   "kind": "term",
   "latex": null,
   "name": "Commodity Price Risk",
   "part": "frm-part-I",
   "reading": "01_building-blocks-risk-management",
   "source": null
  },
  {
   "complete": false,
   "definition": null,
   "id": "credit-risk",
   "kind": "term",
   "latex": null,
   "name": "Credit Risk",
   "part": "frm-part-I",
   "reading": "01_building-blocks-risk-management",
   "source": null
  },
  {
   "complete": false,
   "definition": null,
   "id": "currency-risk",
   "kind": "term",
   "latex": null,
   "name": "Currency Risk",
   "part": "frm-part-I",
   "reading": "01_building-blocks-risk-management",
   "source": null
  },
  {
   "complete": false,
   "definition": null,
   "id": "equity-risk",
   "kind": "term",
   "latex": null,
   "name": "Equity Risk",
   "part": "frm-part-I",
   "reading": "01_building-blocks-risk-management",
   "source": null
  },
  {
   "complete": false,
   "definition": null,
   "id": "expected-shortfall-normal",
   "kind": "missing",
   "latex": null,
   "name": "Expected Shortfall Normal",
   "part": null,
   "reading": null,
   "source": null
  },
  {
   "complete": false,
   "definition": null,
   "id": "interest-rate-risk",
   "kind": "term",
   "latex": null,
   "name": "Interest Rate Risk",
   "part": "frm-part-I",
   "reading": "01_building-blocks-risk-management",
   "source": null
  },
  {
   "complete": false,
   "definition": null,
   "id": "liquidity-risk",
   "kind": "term",
   "latex": null,
   "name": "Liquidity Risk",
   "part": "frm-part-I",
   "reading": "01_building-blocks-risk-management",
   "source": null
  },
  {
   "complete": true,
   "definition": "the change in market prices can drive the value of securities and other assets up and down. Price volatility is the engine of market risk. | Depending on the underlying asset, risk can take different forms such as Equity Risk, Interest Rate Risk, Currency Risk and Commodity Price Risk.",
   "id": "market-risk",
   "kind": "term",
   "latex": null,
   "name": "Market Risk",
   "part": "frm-part-I",
   "reading": "01_building-blocks-risk-management",
   "source": null
  },
  {
   "complete": true,
   "definition": null,
   "id": "parametric-var",
   "kind": "formula",
   "latex": "\\mathrm{VaR}_\\alpha = (z_\\alpha \\sigma - \\mu)\\, V",
   "name": "Parametric (delta-normal) VaR",
   "part": "frm-part-I",
   "reading": "01_building-blocks-risk-management",
   "source": "GARP FRM Part I, Book 4: Valuation and Risk Models, 2025 ed., ch. N, p. N"
  },
  {
   "complete": false,
   "definition": null,
   "id": "parametric-var-sqrt-t",
   "kind": "missing",
   "latex": null,
   "name": "Parametric Var Sqrt T",
   "part": null,
   "reading": null,
   "source": null
  },
  {
   "complete": false,
   "definition": null,
   "id": "value-at-risk",
   "kind": "missing",
   "latex": null,
   "name": "Value At Risk",
   "part": null,
   "reading": null,
   "source": null
  }
 ]
};

const css = getComputedStyle(document.documentElement);
const color = name => css.getPropertyValue("--" + name).trim();
const byId = Object.fromEntries(GRAPH.nodes.map(n => [n.id, n]));

const done = GRAPH.nodes.filter(n => n.complete).length;
document.getElementById("stats").textContent =
  `${GRAPH.nodes.length} nodes · ${GRAPH.edges.length} links · ${done} defined`;

const cy = cytoscape({
  container: document.getElementById("cy"),
  elements: [
    ...GRAPH.nodes.map(n => ({ data: { ...n, label: n.name } })),
    ...GRAPH.edges.map((e, i) => ({ data: { id: "e" + i, ...e } })),
  ],
  style: [
    { selector: "node", style: {
        "label": "data(label)", "color": color("text"), "font-size": 11,
        "text-valign": "bottom", "text-margin-y": 4, "text-wrap": "wrap", "text-max-width": 110,
        "width": 22, "height": 22, "border-width": 2, "border-color": color("panel") } },
    { selector: 'node[kind = "term"]', style: { "background-color": color("term") } },
    { selector: 'node[kind = "concept"]', style: { "background-color": color("concept") } },
    { selector: 'node[kind = "formula"]', style: { "background-color": color("formula"), "shape": "round-rectangle" } },
    { selector: 'node[kind = "missing"]', style: { "background-color": color("missing"), "opacity": 0.7 } },
    { selector: "node[!complete]", style: { "border-style": "dashed", "border-color": color("muted") } },
    { selector: "edge", style: {
        "width": 1.5, "line-color": color("edge"), "curve-style": "bezier",
        "target-arrow-color": color("edge"), "target-arrow-shape": "triangle",
        "label": "data(type)", "font-size": 9, "color": color("muted"), "text-rotation": "autorotate" } },
    { selector: 'edge[type = "related"]', style: { "target-arrow-shape": "none", "label": "" } },
    { selector: ".faded", style: { "opacity": 0.15 } },
    { selector: "node:selected", style: { "border-color": color("text"), "border-width": 3 } },
  ],
  // breadthfirst has no randomness: same data, same picture
  layout: { name: "breadthfirst", directed: false, spacingFactor: 1.2, padding: 30, animate: false },
  wheelSensitivity: 0.3,
});

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function showDetail(n) {
  const links = GRAPH.edges
    .filter(e => e.source === n.id || e.target === n.id)
    .map(e => {
      const other = byId[e.source === n.id ? e.target : e.source];
      const dir = e.type === "related" ? "related to" : e.source === n.id ? e.type + " →" : "← " + e.type;
      return `<li>${esc(dir)} <a href="#" data-id="${esc(other.id)}">${esc(other.name)}</a></li>`;
    }).join("");
  document.getElementById("detail").innerHTML = `
    <h2>${esc(n.name)}</h2>
    <div class="meta">${esc(n.kind)}${n.reading ? " · " + esc(n.part) + " / " + esc(n.reading) : ""}</div>
    ${n.definition ? `<p>${esc(n.definition)}</p>` : n.kind === "formula" ? "" : `<p class="meta">No definition yet.</p>`}
    ${n.latex ? `<pre>${esc(n.latex)}</pre>` : ""}
    ${n.source ? `<p class="meta">Source: ${esc(n.source)}</p>` : ""}
    ${links ? `<strong>Links</strong><ul>${links}</ul>` : ""}`;
}

function focus(node) {
  cy.elements().removeClass("faded");
  cy.elements().not(node.closedNeighborhood()).addClass("faded");
  cy.$(":selected").unselect();
  node.select();
  showDetail(node.data());
}

cy.on("tap", "node", e => focus(e.target));
cy.on("tap", e => { if (e.target === cy) cy.elements().removeClass("faded"); });
document.getElementById("detail").addEventListener("click", e => {
  const id = e.target.dataset && e.target.dataset.id;
  if (id) { e.preventDefault(); focus(cy.getElementById(id)); }
});
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  cy.elements().removeClass("faded");
  if (!q) return;
  const hits = cy.nodes().filter(n => n.data("name").toLowerCase().includes(q) || n.id().includes(q));
  cy.elements().not(hits).addClass("faded");
});
</script>
</body>
</html>
