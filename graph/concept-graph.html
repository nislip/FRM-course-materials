const TABS = [
  { key: "map",      label: "Mind Map" },
  { key: "terms",    label: "Terms",    kind: "term",    title: "Term Glossary" },
  { key: "concepts", label: "Concepts", kind: "concept", title: "Concept Glossary" },
  { key: "formulas", label: "Formulas", kind: "formula", title: "Formula Glossary" },
];
const TAB_FOR_KIND = Object.fromEntries(TABS.filter(t => t.kind).map(t => [t.kind, t.key]));
const byId = Object.fromEntries(GRAPH.nodes.map(n => [n.id, n]));

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const humanize = s => { s = String(s).replace(/[_-]+/g, " "); return s.charAt(0).toUpperCase() + s.slice(1); };

function tex(src, display) {
  if (window.katex) {
    try { return katex.renderToString(String(src), { displayMode: display, throwOnError: false }); } catch (_) {}
  }
  return display ? `<pre>${esc(src)}</pre>` : `<code>${esc(src)}</code>`;
}

// Links of a node, with direction, built once from the edge list
const linksOf = {};
for (const e of GRAPH.edges) {
  (linksOf[e.source] ||= []).push({ id: e.target, label: e.type === "related" ? "related to" : e.type + " →" });
  (linksOf[e.target] ||= []).push({ id: e.source, label: e.type === "related" ? "related to" : "← " + e.type });
}

/* ---------- Field rendering (glossary + map panel) ---------- */

function fmtValue(v) {
  if (typeof v === "number") return v.toLocaleString("en-US", { maximumFractionDigits: 6 });
  if (v && typeof v === "object") {
    return Object.entries(v).map(([k, x]) => `${esc(k)} = ${fmtValue(x)}`).join(", ");
  }
  return esc(v);
}

function renderField({ field, value }) {
  let body;
  if (field === "variables" && Array.isArray(value)) {
    body = `<table><tr><th>Symbol</th><th>Meaning</th><th>Units</th></tr>${value.map(v => `
      <tr><td>${v.symbol ? tex(v.symbol, false) : esc(v.notation || "")}</td>
          <td>${esc(v.meaning || "")}</td><td>${esc(v.units || "")}</td></tr>`).join("")}</table>`;
  } else if (field === "examples" && Array.isArray(value) && value.some(x => x && x.inputs)) {
    body = `<ul>${value.map(x => `<li>${x.inputs ? fmtValue(x.inputs) : ""}${
      x.output !== undefined ? ` → <strong>${fmtValue(x.output)}</strong>` : ""}${
      x.tolerance !== undefined ? ` <span class="meta">(± ${fmtValue(x.tolerance)})</span>` : ""}</li>`).join("")}</ul>`;
  } else if (Array.isArray(value) && value.every(x => typeof x === "string" && x in byId)) {
    // A list of entry ids, e.g. a concept's `formulas: [parametric-var]`: show as links
    body = `<ul class="links">${value.map(x => `<li>${entryLink(byId[x])}</li>`).join("")}</ul>`;
  } else if (Array.isArray(value)) {
    // A list item that is a mapping is usually unquoted text containing ": " in the YAML
    const item = x => x && typeof x === "object"
      ? Object.entries(x).map(([k, v]) => `${esc(k)}: ${typeof v === "object" ? fmtValue(v) : esc(v)}`).join("; ")
      : esc(x);
    body = `<ul>${value.map(x => `<li>${item(x)}</li>`).join("")}</ul>`;
  } else if (value && typeof value === "object") {
    body = `<ul>${Object.entries(value).map(([k, x]) => `<li><strong>${esc(humanize(k))}:</strong> ${
      typeof x === "object" ? fmtValue(x) : esc(x)}</li>`).join("")}</ul>`;
  } else {
    body = `<div>${esc(value)}</div>`;
  }
  return `<div class="field"><div class="field-name">${esc(humanize(field))}</div>${body}</div>`;
}

function linkList(n) {
  const links = linksOf[n.id] || [];
  if (!links.length) return "";
  return `<div class="field"><div class="field-name">Links</div><ul class="links">${links.map(l =>
    `<li><span class="rel">${esc(l.label)}</span> ${entryLink(byId[l.id])}</li>`).join("")}</ul></div>`;
}

// Defined entries link to their glossary card; undefined ones to the map
function entryLink(o) {
  const href = o.kind in TAB_FOR_KIND ? "#" + TAB_FOR_KIND[o.kind] + "/" + o.id : "#map/" + o.id;
  return `<a href="${esc(href)}">${esc(o.name)}</a>`;
}

function body(n, { full }) {
  return `
    ${n.definition ? `<p>${esc(n.definition)}</p>` : n.kind === "formula" ? "" :
      `<p class="meta">${n.kind === "missing" ? "Linked to, but not defined anywhere yet." : "No definition yet."}</p>`}
    ${n.latex ? `<div class="math">${tex(n.latex, true)}</div>` : ""}
    ${full ? n.details.map(renderField).join("") : ""}
    ${linkList(n)}
    ${n.source ? `<p class="meta">Source: ${esc(n.source)}</p>` : ""}`;
}

/* ---------- Glossary ---------- */

function renderGlossary(tab) {
  const el = document.getElementById("glossary");
  const entries = GRAPH.nodes.filter(n => n.kind === tab.kind)
    .sort((a, b) => a.name.localeCompare(b.name));
  el.innerHTML = `
    <div class="glossary-head"><h2>${tab.title}</h2>
      <span class="meta">${entries.length} entr${entries.length === 1 ? "y" : "ies"} · ${entries.filter(n => n.complete).length} defined</span></div>
    ${entries.length ? `<input type="search" id="gloss-search" placeholder="Search ${tab.label.toLowerCase()}…" autocomplete="off">` : ""}
    <div id="gloss-list"></div>`;
  const list = el.querySelector("#gloss-list");

  function draw(q) {
    const shown = entries.filter(n => !q || [n.name, n.id, n.definition || "", ...n.aliases]
      .some(s => s.toLowerCase().includes(q)));
    if (!entries.length) {
      const missing = GRAPH.nodes.filter(n => n.kind === "missing");
      list.innerHTML = `<p class="empty">No ${tab.label.toLowerCase()} in the notes yet.${missing.length ?
        `<br>Linked to but not yet defined: ${missing.map(n => `<a href="#map/${esc(n.id)}">${esc(n.name)}</a>`).join(", ")}.` : ""}</p>`;
      return;
    }
    if (!shown.length) { list.innerHTML = `<p class="empty">No matches.</p>`; return; }
    const groups = {};
    for (const n of shown) (groups[n.name[0].toUpperCase()] ||= []).push(n);
    const letters = Object.keys(groups).sort();
    list.innerHTML = (letters.length > 1 ? `<div class="letters">${letters.map(l =>
        `<a href="#" data-letter="${l}">${l}</a>`).join("")}</div>` : "") +
      letters.map(l => `<div class="letter" id="letter-${l}">${l}</div>${groups[l].map(n => `
        <article class="entry${n.complete ? "" : " incomplete"}" id="entry-${esc(n.id)}">
          <h3>${esc(n.name)}${n.aliases.length ? `<span class="aka">${n.aliases.map(esc).join(", ")}</span>` : ""}
            ${n.complete ? "" : `<span class="badge missing">incomplete</span>`}</h3>
          <div class="meta">${esc(n.part)} · ${esc(n.reading)}</div>
          ${body(n, { full: true })}
          <div class="actions"><a href="#map/${esc(n.id)}">Show on mind map →</a></div>
        </article>`).join("")}`).join("");
  }
  draw("");
  const search = el.querySelector("#gloss-search");
  if (search) search.addEventListener("input", e => draw(e.target.value.trim().toLowerCase()));
  list.addEventListener("click", e => {
    const l = e.target.dataset && e.target.dataset.letter;
    if (l) { e.preventDefault(); document.getElementById("letter-" + l).scrollIntoView({ behavior: "smooth" }); }
  });
}

/* ---------- Mind map ---------- */

let cy = null;
function initMap() {
  const css = getComputedStyle(document.documentElement);
  const color = name => css.getPropertyValue("--" + name).trim();
  const done = GRAPH.nodes.filter(n => n.complete).length;
  document.getElementById("stats").textContent =
    `${GRAPH.nodes.length} nodes · ${GRAPH.edges.length} links · ${done} defined`;

  cy = cytoscape({
    container: document.getElementById("cy"),
    elements: [
      ...GRAPH.nodes.map(n => ({ data: { ...n, label: n.name } })),
      ...GRAPH.edges.map((e, i) => ({ data: { id: "e" + i, ...e } })),
    ],
    style: [
      { selector: "node", style: {
          "label": "data(label)", "color": color("text"), "font-size": 11,
          "text-valign": "bottom", "text-margin-y": 5, "text-wrap": "wrap", "text-max-width": 100,
          "text-background-color": color("bg"), "text-background-opacity": 0.85,
          "text-background-padding": 2, "text-background-shape": "roundrectangle",
          "width": 22, "height": 22, "border-width": 2, "border-color": color("panel") } },
      { selector: 'node[kind = "term"]', style: { "background-color": color("term") } },
      { selector: 'node[kind = "concept"]', style: { "background-color": color("concept") } },
      { selector: 'node[kind = "formula"]', style: { "background-color": color("formula"), "shape": "round-rectangle" } },
      { selector: 'node[kind = "missing"]', style: { "background-color": color("missing"), "opacity": 0.7 } },
      { selector: "node[!complete]", style: { "border-style": "dashed", "border-color": color("muted") } },
      { selector: "edge", style: {
          "width": 1.5, "line-color": color("edge"), "curve-style": "bezier",
          "target-arrow-color": color("edge"), "target-arrow-shape": "triangle",
          "label": "data(type)", "font-size": 9, "color": color("muted"), "text-rotation": "autorotate",
          "text-background-color": color("bg"), "text-background-opacity": 0.85, "text-background-padding": 1 } },
      { selector: 'edge[type = "related"]', style: { "target-arrow-shape": "none", "label": "" } },
      { selector: ".faded", style: { "opacity": 0.15 } },
      { selector: "node:selected", style: { "border-color": color("text"), "border-width": 3 } },
    ],
    // breadthfirst has no randomness: same data, same picture.
    // Counting labels in node size is what keeps long names from overlapping.
    layout: { name: "breadthfirst", directed: false, spacingFactor: 1.15, padding: 30, animate: false,
              avoidOverlap: true, nodeDimensionsIncludeLabels: true },
    wheelSensitivity: 0.3,
  });

  cy.on("tap", "node", e => { location.hash = "map/" + e.target.id(); });
  cy.on("tap", e => { if (e.target === cy) { cy.elements().removeClass("faded"); cy.$(":selected").unselect(); } });
  document.getElementById("map-search").addEventListener("input", e => {
    const q = e.target.value.trim().toLowerCase();
    cy.elements().removeClass("faded");
    if (!q) return;
    const hits = cy.nodes().filter(n => [n.data("name"), n.id(), ...n.data("aliases")]
      .some(s => s.toLowerCase().includes(q)));
    cy.elements().not(hits).addClass("faded");
  });
}

function focusNode(id) {
  const node = cy.getElementById(id);
  if (!node.length) return;
  cy.elements().removeClass("faded");
  cy.elements().not(node.closedNeighborhood()).addClass("faded");
  cy.$(":selected").unselect();
  node.select();
  const n = node.data();
  const gloss = TAB_FOR_KIND[n.kind];
  document.getElementById("detail").innerHTML = `
    <h2>${esc(n.name)}</h2>
    <div class="meta"><span class="badge ${esc(n.kind)}">${n.kind === "missing" ? "not yet defined" : esc(n.kind)}</span>
      ${n.reading ? " " + esc(n.part) + " / " + esc(n.reading) : ""}</div>
    ${body(n, { full: false })}
    ${gloss ? `<p><a href="#${gloss}/${esc(n.id)}">Full entry in glossary →</a></p>` : ""}`;
}

/* ---------- Tabs & routing (#map, #terms, #formulas/parametric-var, …) ---------- */

document.getElementById("tabs").innerHTML = TABS.map(t => {
  const count = t.kind ? `<span class="count">${GRAPH.nodes.filter(n => n.kind === t.kind).length}</span>` : "";
  return `<a href="#${t.key}" role="tab" data-key="${t.key}">${t.label}${count}</a>`;
}).join("");

let currentGlossary = null;
function route() {
  const [key, id] = decodeURIComponent(location.hash.slice(1)).split("/");
  const tab = TABS.find(t => t.key === key) || TABS[0];
  document.querySelectorAll("#tabs a").forEach(a => a.setAttribute("aria-selected", a.dataset.key === tab.key));
  document.getElementById("view-map").hidden = tab.key !== "map";
  document.getElementById("view-glossary").hidden = tab.key === "map";

  if (tab.key === "map") {
    // The map is built the first time it is visible: cytoscape can't lay out a hidden container
    if (!cy) initMap(); else cy.resize();
    if (id) focusNode(id);
  } else {
    if (currentGlossary !== tab.key) { renderGlossary(tab); currentGlossary = tab.key; }
    const el = id && document.getElementById("entry-" + id);
    if (el) {
      el.scrollIntoView({ block: "start" });
      el.classList.add("flash");
      setTimeout(() => el.classList.remove("flash"), 1200);
    } else {
      document.getElementById("view-glossary").scrollTop = 0;
    }
  }
}
window.addEventListener("hashchange", route);
route();
</script>
