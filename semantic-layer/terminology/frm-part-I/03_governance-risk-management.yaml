- id: sarbanes-oxley-act
  name: Sarbanes-Oxley Act
  aliases: null
  acronyms: [SOX]
  definition: >
    US federal legislation passed after the early-2000s corporate failures (Enron, WorldCom, Global Crossing) that
    enforces corporate governance rules through stricter securities regulation.
  related: [comply-or-explain, audit-committee]
  notation: null
  examples: null

- id: comply-or-explain
  name: Comply or Explain
  aliases: null
  acronyms: null
  definition: >
    The approach England took instead of SOX-style legislation, relying on corporate governance codes and a regime
    of "comply or explain".
  related: [sarbanes-oxley-act]
  notation: null
  examples: null

- id: audit-committee
  name: Audit Committee
  aliases: [Board Audit Committee]
  acronyms: null
  definition: >
    A committee of the board of directors. Under SOX the names of its members must be disclosed, and they are expected
    to understand accounting principles and financial statements and to have experience with internal audits.
  related: [sarbanes-oxley-act]
  notation: null
  examples: null

- id: basel-i
  name: Basel I
  aliases: [1988 Basel Accord]
  acronyms: null
  definition: >
    The 1988 Basel Accord, which set capital adequacy standards after the Latin American debt crisis using a
    risk-weighted approach, with minimum capital at 8% of a firm's risk-weighted assets.
  related: [basel-committee, basel-ii]
  notation: null
  examples: null

- id: basel-ii
  name: Basel II
  aliases: null
  acronyms: null
  definition: >
    The BCBS revision of the capital adequacy framework (begun in 1999, set in 2006) that superseded Basel I. It kept
    the 8% minimum but refined the risk weighting and added trading activity alongside lending activity.
  related: [basel-committee, basel-i, basel-iii]
  notation: null
  examples: null

- id: basel-iii
  name: Basel III
  aliases: null
  acronyms: null
  definition: >
    The post-crisis Basel framework, with a big emphasis on capital adequacy. It raised capital quality by limiting
    core Tier 1 capital to common equity and retained earnings, and imposed new short- and long-term liquidity ratios.
  related: [basel-committee, basel-ii, tier-1-capital, liquidity-coverage-ratio, net-stable-funding-ratio, fundamental-review-of-the-trading-book]
  notation: null
  examples: null

- id: tier-1-capital
  name: Tier 1 Capital
  aliases: [Core Capital, Primary Capital]
  acronyms: null
  definition: >
    The sum of common stock, retained earnings and certain reserves.
  related: [basel-iii, comprehensive-capital-analysis-and-review]
  notation: null
  examples: null

- id: liquidity-coverage-ratio
  name: Liquidity Coverage Ratio
  aliases: null
  acronyms: [LCR]
  definition: >
    A 30-day, short-term liquidity ratio imposed by Basel III.
  related: [basel-iii, net-stable-funding-ratio]
  notation: null
  examples: null

- id: net-stable-funding-ratio
  name: Net Stable Funding Ratio
  aliases: null
  acronyms: [NSFR]
  definition: >
    A one-year, long-term liquidity ratio imposed by Basel III.
  related: [basel-iii, liquidity-coverage-ratio]
  notation: null
  examples: null

- id: leverage-ratio
  name: Leverage Ratio
  aliases: null
  acronyms: null
  definition: >
    A minimum leverage ratio of 3%, one of the five elements of the Basel III macroprudential overlay.
  related: null
  notation: null
  examples: null

- id: countercyclical-capital-buffer
  name: Countercyclical Capital Buffer
  aliases: null
  acronyms: null
  definition: >
    A capital buffer that is one of the five elements of the Basel III macroprudential overlay.
  related: null
  notation: null
  examples: null

- id: total-loss-absorbing-capital
  name: Total Loss-Absorbing Capital
  aliases: null
  acronyms: [TLAC]
  definition: >
    Standards that apply to global systemically important banks (G-SIBs); one of the five elements of the Basel III
    macroprudential overlay.
  related: null
  notation: null
  examples: null

- id: systemically-important-markets-and-infrastructures
  name: Systemically Important Markets and Infrastructures
  aliases: null
  acronyms: [SIMIs]
  definition: >
    An element of the Basel III macroprudential overlay. For OTC derivatives, the Basel Committee is pushing the market
    to move as many trades as possible through central clearing and trade reporting.
  related: [over-the-counter]
  notation: null
  examples: null

- id: fundamental-review-of-the-trading-book
  name: Fundamental Review of the Trading Book
  aliases: null
  acronyms: [FRTB]
  definition: >
    The 2016 revision of the Basel framework.
  related: [basel-iii]
  notation: null
  examples: null

- id: dodd-frank-act
  name: Dodd-Frank Act
  aliases: null
  acronyms: null
  definition: >
    A US regulatory response to the 2007-2009 financial crisis.
  related: [systemically-important-financial-institution, orderly-liquidation-authority, living-will, volcker-rule, consumer-financial-protection-bureau, dodd-frank-act-stress-test, comprehensive-capital-analysis-and-review]
  notation: null
  examples: null

- id: supervisory-review-and-evaluation-process
  name: Supervisory Review and Evaluation Process
  aliases: null
  acronyms: [SREP]
  definition: >
    A European regulatory response to the 2007-2009 financial crisis.
  related: [internal-capital-adequacy-assessment-process, internal-liquidity-adequacy-assessment-process, eba-stress-test]
  notation: null
  examples: null

- id: gramm-leach-bliley-act
  name: Gramm-Leach-Bliley Act
  aliases: null
  acronyms: [GLBA]
  definition: >
    The 1999 US act that abolished the restrictions of the Glass-Steagall Act, letting bank holding companies convert
    into financial services holding companies (FSHCs).
  related: null
  notation: null
  examples: null

- id: systemically-important-financial-institution
  name: Systemically Important Financial Institution
  aliases: null
  acronyms: [SIFI]
  definition: >
    Under Dodd-Frank, a bank holding firm with more than USD 50 billion in assets. SIFIs are regulated by the Federal
    Reserve.
  related: [dodd-frank-act, living-will]
  notation: null
  examples: null

- id: orderly-liquidation-authority
  name: Orderly Liquidation Authority
  aliases: null
  acronyms: [OLA]
  definition: >
    The mechanism Dodd-Frank created to replace "too big to fail", so a failing firm can be wound down in an orderly way.
  related: [dodd-frank-act]
  notation: null
  examples: null

- id: living-will
  name: Living Will
  aliases: [Resolution Plan]
  acronyms: null
  definition: >
    A resolution plan that SIFIs must submit to the Federal Reserve and the FDIC, laying out a corporate governance
    structure for resolution planning.
  related: [dodd-frank-act, systemically-important-financial-institution]
  notation: null
  examples: null

- id: volcker-rule
  name: Volcker Rule
  aliases: null
  acronyms: null
  definition: >
    The Dodd-Frank provision, proposed by former Fed Chairman Paul Volcker and effective July 2015, that bans banking
    entities from proprietary trading and from owning or partnering in hedge funds and private equity funds.
  related: [dodd-frank-act]
  notation: null
  examples: null

- id: consumer-financial-protection-bureau
  name: Consumer Financial Protection Bureau
  aliases: null
  acronyms: [CFPB]
  definition: >
    The agency created by Dodd-Frank to regulate consumer financial services and products.
  related: [dodd-frank-act]
  notation: null
  examples: null

- id: dodd-frank-act-stress-test
  name: Dodd-Frank Act Stress Test
  aliases: null
  acronyms: [DFAST]
  definition: >
    One of the two Federal Reserve stress testing exercises, for banks with assets above USD 10 billion.
  related: [dodd-frank-act, comprehensive-capital-analysis-and-review, stress-testing]
  notation: null
  examples: null

- id: comprehensive-capital-analysis-and-review
  name: Comprehensive Capital Analysis and Review
  aliases: null
  acronyms: [CCAR]
  definition: >
    The Federal Reserve's annual stress testing exercise for large banks, in which a BHC presents a capital plan over
    a nine-quarter horizon under supervisory and internally generated scenarios.
  related: [dodd-frank-act, dodd-frank-act-stress-test, stress-testing, tier-1-capital, eba-stress-test]
  notation: null
  examples: null

- id: internal-capital-adequacy-assessment-process
  name: Internal Capital Adequacy Assessment Process
  aliases: null
  acronyms: [ICAAP]
  definition: >
    One of the two key components of SREP. It incorporates scenario analysis and stress testing, showing how stress
    testing supports capital planning.
  related: [supervisory-review-and-evaluation-process, internal-liquidity-adequacy-assessment-process, stress-testing]
  notation: null
  examples: null

- id: internal-liquidity-adequacy-assessment-process
  name: Internal Liquidity Adequacy Assessment Process
  aliases: null
  acronyms: [ILAAP]
  definition: >
    One of the two key components of SREP. It incorporates the potential losses from asset liquidation and higher
    funding costs during stressful periods.
  related: [supervisory-review-and-evaluation-process, internal-capital-adequacy-assessment-process]
  notation: null
  examples: null

- id: eba-stress-test
  name: EBA Stress Test
  aliases: [European Banking Authority Stress Test]
  acronyms: null
  definition: >
    The stress test EU banks with assets of 30 billion or more must run. Its scenarios unfold over three years and it
    is fundamentally static, looking only at the immediate impact of the cumulative shocks.
  related: [supervisory-review-and-evaluation-process, comprehensive-capital-analysis-and-review, stress-testing]
  notation: null
  examples: null
